services:
  # ── GPU 版本（DeepStream + TensorRT 基础镜像） ──────────────────────
  ocr-gpu:
    image: ghcr.io/yorkane/rapidocr-api:latest
    container_name: ocr-gpu
    restart: unless-stopped
    ports:
      - "8089:8089"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - OCR_SERVICE_PORT=8089
      - OCR_WORKERS=2
      - OCR_THREADS=4
      - OCR_MAX_REQUESTS=1000
      - LOG_LEVEL=info
    volumes:
      - ./models:/app/rapidocr/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8089/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    profiles:
      - gpu

  # ── CPU 版本（python:3.10-slim + onnxruntime） ─────────────────────
  ocr-cpu:
    image: ghcr.io/yorkane/rapidocr-api:cpu
    container_name: ocr-cpu
    restart: unless-stopped
    ports:
      - "8089:8089"
    environment:
      - OCR_SERVICE_PORT=8089
      - OCR_WORKERS=4
      - OCR_THREADS=4
      - OCR_MAX_REQUESTS=1000
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8089/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles:
      - cpu

